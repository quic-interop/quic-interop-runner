on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: install tools
        run: pip install flake8 black
      - name: enforce coding styles using flake8
        run: flake8 .
      - name: run Black linter
        if: success() || failure() # run this step even if the previous one failed
        run: black --check --diff .
      - name: check that QUIC implementations are valid
        if: success() || failure() # run this step even if the previous one failed
        run: python implementations.py -p quic
      - name: check that WebTransport implementations are valid
        if: success() || failure() # run this step even if the previous one failed
        run: python implementations.py -p webtransport
      - uses: ludeeus/action-shellcheck@master
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      # Same as in interop-test.yml, so that the tests use the same Wireshark.
      - name: Install Wireshark
        run: |
          sudo add-apt-repository ppa:wireshark-dev/nightly
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
      - name: Install Python packages
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest -v
